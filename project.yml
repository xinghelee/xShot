name: xShot
options:
  bundleIdPrefix: com.xinghelee
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  xShot:
    type: application
    platform: macOS
    sources: [xShot]
    info:
      path: xShot/Info.plist
      properties:
        CFBundleName: xShot
        CFBundleDisplayName: xShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: xinghe
        NSScreenCaptureUsageDescription: xShot 需要屏幕录制权限来截图和录屏。
        NSMicrophoneUsageDescription: xShot 在录屏时可以录制麦克风声音。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinghelee.xshot
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
